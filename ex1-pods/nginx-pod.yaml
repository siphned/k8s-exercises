apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: ex1
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /shared

    - name: curl
      image: curlimages/curl
      command: ["sh", "-c", "while true; do curl -s localhost; sleep 5; done"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared

  volumes:
    - name: shared-data
      emptyDir: {}

  restartPolicy: Always