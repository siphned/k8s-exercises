apiVersion: v1
kind: Pod
metadata:
  name: crash-pod
  namespace: ex1
  labels:
    app: crash-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.26
      ports:
        - name: http
          containerPort: 80

    - name: curl
      image: curlimages/curl
      command:
        - sh
        - -c
        - |
          curl -s localhost
          exit 1

  restartPolicy: Always
