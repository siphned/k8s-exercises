apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deploy
  namespace: ex2
  annotations:
    kubernetes.io/change-cause: "Update nginx image version to 1.27"

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80

      restartPolicy: Always
