apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deploy
  namespace: ex2

spec:
  replicas: 3
  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80

      restartPolicy: Always
